<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    L'icône d'onglet. Next la sert automatiquement depuis `app/icon.svg`.

    Sans elle, `/favicon.ico` répond 404 et le navigateur affiche une page
    blanche générique — sur les huit onglets qu'on garde ouverts.

    Le dégradé reprend exactement celui de la pastille de la barre latérale
    (`.sidebar-mark`), et la carte inclinée dit ce que fait l'application sans
    texte, à 16 px.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ecf8e" />
      <stop offset="1" stop-color="#2a9d6b" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)" />
  <g transform="rotate(-12 16 16)">
    <rect x="10" y="7" width="12" height="18" rx="2" fill="#0f2b1f" opacity="0.92" />
    <rect x="11.5" y="8.5" width="9" height="10" rx="1" fill="#3ecf8e" opacity="0.55" />
    <rect x="11.5" y="20" width="6" height="1.6" rx="0.8" fill="#3ecf8e" opacity="0.8" />
    <rect x="11.5" y="22.4" width="4" height="1.6" rx="0.8" fill="#3ecf8e" opacity="0.5" />
  </g>
</svg>
